name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-quality:
    name: test-and-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install coverage lizard pylint radon

      - name: Unit tests (TDD, unittest) with branch coverage >= 100%
        run: |
          TESTFILES=$(find . -path './.git' -prune -o -type f -name 'test_*.py' -print)
          if [ -n "$TESTFILES" ]; then
            coverage run --branch -m unittest discover -s . -p "test_*.py"
            coverage report -m --fail-under=100
          else
            echo "::warning::No test_*.py files found yet - skipping test/coverage gate."
          fi

      - name: Function size / cyclomatic complexity (lizard: NLOC<=50, CCN<=10)
        run: |
          PYFILES=$(find . -path './.git' -prune -o -type f -name '*.py' -print | { grep -v '/test_[^/]*\.py$' || true; })
          if [ -n "$PYFILES" ]; then
            lizard $PYFILES -C 10 -L 50
          else
            echo "::warning::No production .py files found yet - skipping complexity gate."
          fi

      - name: Naming convention / duplicate code (pylint)
        run: |
          PYFILES=$(find . -path './.git' -prune -o -type f -name '*.py' -print)
          if [ -n "$PYFILES" ]; then
            pylint $PYFILES
          else
            echo "::warning::No .py files found yet - skipping pylint gate."
          fi
